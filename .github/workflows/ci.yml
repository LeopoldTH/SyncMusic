# Integration continue: types et tests sur chaque push et PR, puis deploiement
# Fly automatique sur main, seulement si la verification est verte.
#
# Le deploy avait ete retire une premiere fois (commit ce6858f): fly launch
# l avait injecte sans que le secret FLY_API_TOKEN existe, donc il echouait en
# rouge a chaque push, et sans --ha=false. Le remettre exige les deux:
# le secret dans GitHub (Settings > Secrets > Actions), et le flag ci-dessous.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    # Deux pushes rapproches ne doivent pas deployer en parallele: le second
    # attend que le premier finisse, et les machines ne se marchent pas dessus.
    concurrency: fly-deploy
    steps:
      - uses: actions/checkout@v5
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # --ha=false est obligatoire: les rooms vivent en memoire d UN process
      # (docs/solutions/workflow-issues/fly-launch-reecrit-la-config.md).
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
