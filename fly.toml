# fly.toml app configuration file generated for syncmusic-leopold on 2026-08-21T22:28:41+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

# ATTENTION: les rooms vivent en memoire. Il faut UNE SEULE machine, sinon deux
# participants peuvent atterrir sur deux memoires differentes et ne jamais se voir.
# Deployer avec `fly deploy --ha=false`.

app = 'syncmusic-leopold'
primary_region = 'cdg'

[build]
[env]
  # Adresse publique reelle. Obligatoire depuis le chantier comptes: elle sert la
  # redirect URI declaree chez Google et l origine autorisee. Le serveur refuse de
  # demarrer sans. (ALLOWED_ORIGIN fait double emploi et disparaitra avec U3.)
  BASE_URL = 'https://syncmusic-leopold.fly.dev'
  ALLOWED_ORIGIN = 'https://syncmusic-leopold.fly.dev'
  PORT = '8787'
  # Sur le volume monte ci-dessous, jamais dans le systeme de fichiers de la machine:
  # celui-ci repart de zero a chaque redeploiement, comptes et historique avec.
  DB_PATH = '/data/syncmusic.db'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

# Disque durable, seule chose qui survit a un redeploiement (volume `data`, cree le
# 22/08/2026). La base SQLite des comptes y vit, via DB_PATH ci-dessus.
[mounts]
  source = 'data'
  destination = '/data'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
