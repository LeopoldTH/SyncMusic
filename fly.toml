app = 'syncmusic-leopold'
primary_region = 'cdg'

[build]
[env]
  ALLOWED_ORIGIN = 'https://syncmusic-leopold.fly.dev'
  PORT = '8787'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
